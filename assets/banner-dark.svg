<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Mustafa Hamad ElAmin, Front-End Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#0f1f1a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#34d399"/>
    </pattern>
    <radialGradient id="fade" cx="0.85" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="m"><rect width="1280" height="320" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1280" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)" mask="url(#m)"/>
    <circle cx="1090" cy="160" r="210" fill="#34d399" opacity="0.07"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="22" fill="#8b949e">
      <text x="880" y="118">&lt;<tspan fill="#34d399">Developer</tspan></text>
      <text x="912" y="152">name=<tspan fill="#a5d6ff">"Mustafa"</tspan></text>
      <text x="912" y="186">stack=<tspan fill="#a5d6ff">"React · Next.js"</tspan></text>
      <text x="912" y="220">focus=<tspan fill="#a5d6ff">"UI"</tspan></text>
      <text x="880" y="254">/&gt;</text>
    </g>
    <rect x="80" y="92" width="64" height="6" rx="3" fill="url(#accent)"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
      <text x="80" y="164" font-size="58" font-weight="700" fill="#f0f6fc" letter-spacing="-1">Mustafa Hamad ElAmin</text>
      <text x="80" y="210" font-size="26" font-weight="600" fill="#34d399">Front-End Developer</text>
      <text x="80" y="250" font-size="20" fill="#9198a1">React  ·  Next.js  ·  TypeScript  ·  Tailwind CSS</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="24" fill="none" stroke="#30363d"/>
</svg>
